<svg xmlns="http://www.w3.org/2000/svg" width="412" height="252" viewBox="-6 -6 412 252" role="img" aria-label="q-agent: Native fleet agents with signed commands, local role ceilings and encrypted shells.">
<title>q-agent: Native fleet agents with signed commands, local role ceilings and encrypted shells.</title>
<defs><clipPath id="frame"><rect x="1" y="1" width="398" height="238" rx="18"/></clipPath></defs>
<style>
text { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #172B4D; }
.muted { fill: #425A76; }
.accent { fill: #006B85; }
.spin { animation: spin 26s linear infinite; }
.reverse { animation-direction: reverse; animation-duration: 18s; }
.pulse { animation: pulse 3s ease-in-out infinite; }
.blink { animation: blink 1s steps(1,end) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .45; } }
@keyframes blink { 50% { opacity: 0; } }
.sweep { animation: sweep 5s ease-in-out infinite; } @keyframes sweep { 0% { transform: translateX(-400px); } 60%,100% { transform: translateX(400px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="1" y="1" width="398" height="238" rx="18" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/>
<g clip-path="url(#frame)">
<rect x="1" y="1" width="398" height="238" rx="18" fill="#FFFFFF"/>
<defs><linearGradient id="sweep"><stop stop-color="#3B6515" stop-opacity="0"/><stop offset=".5" stop-color="#3B6515" stop-opacity=".16"/><stop offset="1" stop-color="#3B6515" stop-opacity="0"/></linearGradient></defs>
<rect class="sweep" width="400" height="240" fill="url(#sweep)"/>
<path d="M2 18V222" stroke="#3B6515" stroke-width="4"/>
