<svg xmlns="http://www.w3.org/2000/svg" width="400" height="72" viewBox="0 0 400 72" role="img" aria-label="Thanks for visiting">
<title>Thanks for visiting</title>
<defs><clipPath id="frame"><rect x="1" y="1" width="398" height="70" rx="18"/></clipPath></defs>
<style>
text { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #172B4D; }
.muted { fill: #425A76; }
.accent { fill: #006B85; }
.spin { animation: spin 26s linear infinite; }
.reverse { animation-direction: reverse; animation-duration: 18s; }
.pulse { animation: pulse 3s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .45; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="1" y="1" width="398" height="70" rx="18" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/>
<g clip-path="url(#frame)"><path d="M0 36H400" stroke="#006B85" opacity=".4"/>
<rect x="52" y="17" width="296" height="38" rx="19" fill="#F6F8FA" stroke="#D0D7DE"/>
<text x="200" y="42" text-anchor="middle" font-size="16" class="muted">&lt;/&gt; THANKS FOR VISITING</text></g>
</svg>
