<svg xmlns="http://www.w3.org/2000/svg" width="412" height="252" viewBox="-6 -6 412 252" role="img" aria-label="aya's playground: Cryptography CTF marketplace with sandboxed verification and licensed challenge bundles.">
<title>aya's playground: Cryptography CTF marketplace with sandboxed verification and licensed challenge bundles.</title>
<defs><clipPath id="frame"><rect x="1" y="1" width="398" height="238" rx="18"/></clipPath></defs>
<style>
text { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #172B4D; }
.muted { fill: #425A76; }
.accent { fill: #006B85; }
.spin { animation: spin 26s linear infinite; }
.reverse { animation-direction: reverse; animation-duration: 18s; }
.pulse { animation: pulse 3s ease-in-out infinite; }
