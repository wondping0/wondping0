<defs><linearGradient id="sweep"><stop stop-color="#27743D" stop-opacity="0"/><stop offset=".5" stop-color="#27743D" stop-opacity=".16"/><stop offset="1" stop-color="#27743D" stop-opacity="0"/></linearGradient></defs>
<rect class="sweep" width="400" height="240" fill="url(#sweep)"/>
