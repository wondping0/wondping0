@keyframes pulse { 50% { opacity: .45; } }
@keyframes blink { 50% { opacity: 0; } }
.sweep { animation: sweep 5s ease-in-out infinite; } @keyframes sweep { 0% { transform: translateX(-400px); } 60%,100% { transform: translateX(400px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
